# Server port for REST APIs (Render/Railway inject PORT env variable)
server.port=${PORT:8080}

# Database Configuration — Fallback to local H2 if DB_URL is not specified
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/studymatedb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000

# JPA/Hibernate Properties
# 'update' keeps existing data and adds new columns automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Explicit dialect — required by Hibernate 6 / Spring Boot 3 when auto-detection fails
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# AI Service Configuration — Loaded from .env or environment variables
gemini.api.key=${GEMINI_API_KEY:}

# Groq AI Configuration
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
