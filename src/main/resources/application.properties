# Server port for potential REST APIs
server.port=8080

# Database Configuration — Loaded from .env or environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Properties
# 'update' keeps existing data and adds new columns automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# AI Service Configuration — Loaded from .env or environment variables
gemini.api.key=${GEMINI_API_KEY:}
